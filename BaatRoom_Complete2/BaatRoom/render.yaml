# Optional Render Blueprint. Free hobby tier: sleeping / ephemeral disk restrictions
# apply. See README. No database/account service is needed by visitors.
services:
  - type: web
    name: baatroom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: BaatRoom
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_COUNT
        value: "1"
      - key: DATA_DIR
        value: /tmp/baatroom
      - key: GUNICORN_THREADS
        value: "100"
      - key: TURN_PROVIDER
        value: auto
      - key: ICE_TRANSPORT_POLICY
        value: all
      # Add TURN_KEY_ID and TURN_KEY_API_TOKEN later in Render > Environment.
      # Text chat works before these are added; public audio calls need them.
